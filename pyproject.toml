[project]
name = "schamp"
version = "0.1.0"
description = "Acquire and analyze ion mobility mass spectrometry data from RF-confining drift cells on Waters Synapt instruments."
requires-python = "==3.12.*"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "numpy~=2.5.2",
    "scipy~=1.18.0",
    "matplotlib~=3.11.1",
]

# The Waters MassLynx SDK (`masslynxsdk`, v5.0.0) is a runtime dependency of the
# extraction layer but is deliberately NOT declared here: it is not on PyPI and
# its EULA forbids redistribution, so a fresh clone cannot resolve it. It is
# installed into this environment from the user's own Waters download by
# tools/install_sdk.py (lab record, task 02, which also settles how the wheel
# survives `uv sync`). Everything that is not extraction runs without it.

[project.optional-dependencies]
# The acquisition GUI, `schamp-acquire` (lab record, task 14). Optional so that the
# library and the notebooks never pull Qt: only `schamp.acquire`'s widget modules import
# PySide6, and tools/check_public.py reports the GUI checks SKIPPED when it is absent.
acquire = ["PySide6-Essentials~=6.12.0"]

[project.scripts]
schamp-acquire = "schamp.acquire.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schamp"]

[tool.uv]
package = true

[dependency-groups]
# Needed only to execute examples/*.ipynb and to run the acquisition GUI --
# tools/check_public.py checks for this group rather than assuming it, and reports
# SKIPPED rather than FAIL when it is absent.
dev = [
    "ipykernel~=7.3.0",
    "jupyter~=1.1.1",
    "nbclient~=0.11.0",
    "nbformat~=5.11.1",
    # The same pin as the `acquire` extra, so that `uv run schamp-acquire` works in a
    # development checkout with no flag. Elsewhere: `uv run --extra acquire schamp-acquire`.
    "PySide6-Essentials~=6.12.0",
    # Freezing schamp-acquire for the installer and the portable zip, tools/build_exe.py
    # (lab record, task 16). A build tool only: nothing imports it at run time, and the
    # bootloader it puts in a build is under its GPL's bootloader exception.
    "pyinstaller~=6.22.3",
]
